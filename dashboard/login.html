<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Login | Rover AgroTech</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-intro"><span class="eyebrow">ROVER AGROTECH</span><h2>Um olhar mais perto<br>do campo.</h2><p>Solo, clima e localização reunidos para acompanhar cada coleta do seu rover agrícola.</p><div class="login-tags"><span>🌱 Solo</span><span>☀ Clima</span><span>⌖ Localização</span></div><small>PROJETO DE CONCLUSÃO DE CURSO</small></section><section class="login-card">

            <div class="logo">
                <span>🌿</span>
                <h1>Rover AgroTech</h1>
            </div>

            <p class="login-subtitle">
                Sistema de monitoramento agrícola
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="username">Usuário</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Digite seu usuário" autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha" autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>

                <p id="loginMessage" role="status" aria-live="polite" class="login-message"></p>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
